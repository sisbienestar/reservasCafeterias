<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reservas · UIS</title>

  <link rel="icon" href="assets/img/favicon.webp" type="image/webp">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/componentes.css">
  <link rel="stylesheet" href="css/paginas.css">
</head>
<body>

  <header class="cabecera">
    <div class="contenedor cabecera__interior">
      <a class="marca" href="index.html">
        <img class="marca__logo" src="assets/img/logo-uis.webp"
             alt="Universidad Industrial de Santander" data-logo>
        <span class="marca__texto">
          <span class="marca__institucion">Universidad Industrial de Santander</span>
          <span class="marca__producto">Sistema de Reserva de Almuerzos Cafeterías UIS</span>
        </span>
      </a>
    </div>
  </header>

  <main class="contenedor pagina" id="contenido">

    <a class="enlace-volver" href="index.html">← Todas las cafeterías</a>

    <section class="encabezado-reserva">
      <div class="encabezado-reserva__texto">
        <p class="encabezado-reserva__ubicacion" id="ubicacion-cafeteria"></p>
        <h1 class="encabezado-reserva__titulo" id="nombre-cafeteria">…</h1>
        <p class="encabezado-reserva__meta">
          <span id="fecha-hoy"></span>
        </p>
      </div>
      <button class="boton boton--primario" id="boton-reservar" type="button" disabled>
        Registrar reserva
      </button>
    </section>

    <p class="aviso" id="aviso" role="status" hidden></p>

    <section class="bloque-tabla" aria-labelledby="titulo-tabla">
      <h2 class="seccion__titulo" id="titulo-tabla">Reservas de hoy</h2>
      <!-- El consolidado va dentro de esta sección, no en una propia: habla
           de las mismas reservas que la tabla y lo cubre su mismo título.
           Sin aria-live a propósito — la tabla de abajo ya es una región en
           vivo, y anunciar dos veces el mismo cambio estorba más que informa. -->
      <div id="contenedor-resumen"></div>
      <div id="contenedor-tabla" aria-live="polite"></div>
    </section>

  </main>

  <footer class="pie">
    <div class="contenedor">
      <p>Bienestar Universitario · Universidad Industrial de Santander</p>
    </div>
  </footer>


  <script type="module" src="js/paginaReserva.js"></script>
</body>
</html>
